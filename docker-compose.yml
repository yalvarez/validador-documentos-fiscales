services:
  postgres:
    image: postgres:16
    container_name: validador-postgres
    environment:
      POSTGRES_USER: validador
      POSTGRES_PASSWORD: validador
      POSTGRES_DB: validador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validador"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./src
      dockerfile: api/Dockerfile
    container_name: validador-backend
    environment:
      - DB_ENGINE=postgres
      - DB_CONNECTION_STRING=postgresql://validador:validador@postgres:5432/validador
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db.sqlite3:/app/db/db.sqlite3
    ports:
      - "7000:8000"
    restart: unless-stopped

