services:
  postgres:
    image: postgres:16
    container_name: validador-postgres
    environment:
      POSTGRES_USER: validador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: validador
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validador"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./src
      dockerfile: api/Dockerfile
    container_name: validador-backend
    environment:
      - DB_ENGINE=postgres
      - DB_CONNECTION_STRING=postgresql://validador:${POSTGRES_PASSWORD}@postgres:5432/validador
      - API_KEYS=${API_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7000:8000"
    restart: unless-stopped

  seguimiento:
    build:
      context: ./src
      dockerfile: api/Dockerfile
    container_name: validador-seguimiento
    command: python -m seguimiento.worker_main
    environment:
      - DB_ENGINE=postgres
      - DB_CONNECTION_STRING=postgresql://validador:${POSTGRES_PASSWORD}@postgres:5432/validador
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Consola web en http://localhost:5173/client: pide usuario/contrasena (CONSOLA_HTPASSWD_B64) y
  # reenvia /client/api a la API con CONSOLA_API_KEY.
  frontend:
    build:
      context: ./src/client
    container_name: validador-frontend
    environment:
      - CONSOLA_API_KEY=${CONSOLA_API_KEY:-}
      - CONSOLA_HTPASSWD_B64=${CONSOLA_HTPASSWD_B64:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  pgdata:
